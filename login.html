<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Sign Up</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #121212 0%, #2c2c2c 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #f8f9fa;
    }

    .container {
      background: #0a1b24;
      border-radius: 10px;
      box-shadow: 0 0 25px #00e1ff;
      position: relative;
      overflow: hidden;
      width: 850px;
      max-width: 95%;
      min-height: 480px;
      transition: all 0.6s ease-in-out;
    }

    /* FORM CONTAINERS */
    .form-container {
      position: absolute;
      top: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-color: #041014;
      padding: 0 50px;
      width: 50%;
      transition: all 0.6s ease-in-out;
      z-index: 2;
    }

    .sign-in-container {
      left: 0;
    }

    .sign-up-container {
      left: 50%;
      opacity: 0;
      z-index: 1;
    }

    /* Move forms when active */
    .container.right-panel-active .sign-in-container {
      transform: translateX(-100%);
    }

    .container.right-panel-active .sign-up-container {
      transform: translateX(-100%);
      opacity: 1;
      z-index: 5;
      animation: show 0.6s;
    }

    @keyframes show {
      0%, 49.99% {
        opacity: 0;
        z-index: 1;
      }
      50%, 100% {
        opacity: 1;
        z-index: 5;
      }
    }

    form {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    form h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }

    input {
      background: none;
      border: none;
      border-bottom: 2px solid #00e1ff;
      margin: 12px 0;
      padding: 10px;
      color: #fff;
      outline: none;
      font-size: 0.95em;
      transition: 0.3s;
    }

    input:focus {
      border-bottom-color: #00b5cc;
    }

    button {
      border: none;
      border-radius: 25px;
      background-color: #00e1ff;
      color: #041014;
      padding: 10px 45px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 20px;
    }

    button:hover {
      background-color: #00b5cc;
      transform: scale(1.05);
    }

    p {
      margin-top: 15px;
      font-size: 0.9em;
    }

    p a {
      color: #00e1ff;
      text-decoration: none;
      font-weight: 500;
    }

    p a:hover {
      text-decoration: underline;
    }

    /* OVERLAY */
    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.6s ease-in-out;
      z-index: 100;
    }

    .overlay {
      background: linear-gradient(to right, #00e1ff, #00b8e6);
      color: white;
      position: relative;
      left: -100%;
      height: 100%;
      width: 200%;
      transform: translateX(0);
      transition: transform 0.6s ease-in-out;
    }

    .container.right-panel-active .overlay {
      transform: translateX(50%);
    }

    .overlay-panel {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 0 40px;
      text-align: center;
      top: 0;
      height: 100%;
      width: 50%;
      transition: transform 0.6s ease-in-out;
    }

    .overlay-left {
      transform: translateX(-20%);
    }

    .container.right-panel-active .overlay-left {
      transform: translateX(0);
    }

    .overlay-right {
      right: 0;
      transform: translateX(0);
    }

    .container.right-panel-active .overlay-right {
      transform: translateX(20%);
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .container {
        width: 90%;
        min-height: 600px;
      }

      .form-container,
      .overlay-container {
        width: 100%;
        left: 0;
      }

      .overlay {
        display: none;
      }

      .sign-in-container,
      .sign-up-container {
        width: 100%;
        left: 0;
      }

      .container.right-panel-active .sign-in-container {
        transform: translateX(0);
      }

      .container.right-panel-active .sign-up-container {
        transform: translateX(0);
        opacity: 1;
        z-index: 5;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <!-- LOGIN FORM -->
    <div class="form-container sign-in-container">
      <form id="loginForm">
        <h1>Login</h1>
        <input type="email" placeholder="Email" id="loginEmail" required />
        <input type="password" placeholder="Password" id="loginPassword" required />
        <button type="submit">Login</button>
        <p>Don't have an account? <a href="#" id="signUpLink">Sign Up</a></p>
      </form>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form-container sign-up-container">
      <form id="signupForm">
        <h1>Create Account</h1>
        <input type="text" placeholder="Name" id="signupName" required />
        <input type="email" placeholder="Email" id="signupEmail" required />
        <input type="password" placeholder="Password" id="signupPassword" required />
        <button type="submit">Sign Up</button>
        <p>Already have an account? <a href="#" id="signInLink">Login</a></p>
      </form>
    </div>

    <!-- OVERLAY -->
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h1>Welcome Back!</h1>
          <p>To stay connected, please log in with your personal info.</p>
        </div>
        <div class="overlay-panel overlay-right">
          <h1>Hello, Friend!</h1>
          <p>Enter your details and start your journey with us.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/src/js/auth.js"></script>
  <script>
    const container = document.getElementById("container");
    const signUpLink = document.getElementById("signUpLink");
    const signInLink = document.getElementById("signInLink");

    signUpLink.addEventListener("click", (e) => {
      e.preventDefault();
      container.classList.add("right-panel-active");
    });

    signInLink.addEventListener("click", (e) => {
      e.preventDefault();
      container.classList.remove("right-panel-active");
    });

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const name = email.split('@')[0];
      
      localStorage.setItem("currentUser", JSON.stringify({ email: email, name: name }));
      localStorage.setItem("isLoggedIn", "true");
      
      window.location.href = "index.html";
    });

    document.getElementById("signupForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      
      localStorage.setItem("currentUser", JSON.stringify({ name: name, email: email }));
      localStorage.setItem("isLoggedIn", "true");

      window.location.href = "index.html";
    });
  </script>
</body>
</html>
